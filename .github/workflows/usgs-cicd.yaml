name: CI-CD USGS Pipeline

# Push dan pull request menguji kode serta CSV contoh.
# Manual dan schedule mengambil data USGS lalu mengunggahnya ke Azure.
on:
  push:
    branches: [main]
    paths:
      - 'ingest.py'
      - 'tests/**'
      - 'fixtures/**'
      - '.github/workflows/usgs-cicd.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'ingest.py'
      - 'tests/**'
      - 'fixtures/**'
      - '.github/workflows/usgs-cicd.yaml'
  workflow_dispatch:
  schedule:
    # Setiap 6 jam UTC, setara 07:00, 13:00, 19:00, dan 01:00 WIB.
    - cron: '0 */6 * * *'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pasang dependensi
        run: python -m pip install --upgrade pip pytest

      - name: Uji kode dan data contoh
        run: python -m pytest -q

  ingest:
    name: Ingest
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ambil data USGS
        run: python ingest.py --output out/earthquakes.csv

      - name: Simpan CSV sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: usgs-events
          path: out/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: ingest
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
    steps:
      - name: Unduh artifact dari ingest
        uses: actions/download-artifact@v4
        with:
          name: usgs-events
          path: artifact

      - name: Login ke Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Unggah dan verifikasi blob
        shell: bash
        run: |
          set -euo pipefail

          DT=$(date -u +%F)
          TARGET="bronze/usgs_actions/dt=$DT/earthquakes.csv"

          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name "$TARGET" \
            --file artifact/earthquakes.csv \
            --auth-mode login \
            --overwrite

          EXISTS=$(az storage blob exists \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name "$TARGET" \
            --auth-mode login \
            --query exists -o tsv)

          if [ "$EXISTS" != "true" ]; then
            echo "Blob tidak ditemukan: $TARGET"
            exit 1
          fi

          REMOTE=$(az storage blob show \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name "$TARGET" \
            --auth-mode login \
            --query properties.contentLength -o tsv)
          LOCAL=$(stat -c%s artifact/earthquakes.csv)

          if [ "$REMOTE" != "$LOCAL" ]; then
            echo "Ukuran tidak cocok: remote=$REMOTE lokal=$LOCAL"
            exit 1
          fi

          {
            echo "### Hasil deploy"
            echo "- Storage account: $STORAGE_ACCOUNT"
            echo "- Container: $CONTAINER"
            echo "- Tujuan: $TARGET"
            echo "- Ukuran: $REMOTE byte, sama dengan artefak ingest"
          } >> "$GITHUB_STEP_SUMMARY"
